<!DOCTYPE html>

                    "fontFamily": {

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Background Image Layer -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A luxurious, modern hotel lobby bathed in warm, soft morning light. The interior features elegant, minimalist architecture with high ceilings, grand marble columns, and plush seating arrangements in muted tones. The aesthetic is premium corporate modern, utilizing a sophisticated palette of deep navy accents, champagne gold fixtures, and expansive slate-grey polished floors. The atmosphere is serene, welcoming, and highly professional." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDPO4OEeT7PeOUWwF7z4CLm1D2LkM5OusYRL_iarCH9-GrjZ8D5a6H74puQEjw2MoJs61C9eCv_bC8kMR6eYRo4ZBhfj1huMhPGy_sn3cXqOGJsgaTpvSDGbr5z5jichdrHoMiAdpqfz-X5aWw9uKaachEjyLNRdYaK0ev_2S8GECuMv5YyNg-7ezqaUKMTEwMg4yB2E6Eh4LNR4xAJD_Iji0lZjzMAMRiLT1Dnnj0UFTTFHnNL7zGOxA')"></div>
<div class="absolute inset-0 bg-primary/60 backdrop-blur-sm"></div>
</div>
<!-- Login Card Container -->
<div class="relative z-10 w-full max-w-md px-gutter md:px-0">
<!-- Brand Header -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-on-primary mb-2">Luxe Stay</h1>
<p class="font-body-lg text-body-lg text-surface-container-high">Premium Management</p>
</div>
<!-- Card Surface -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant p-8 w-full">
<div class="mb-8 text-center">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access the dashboard.</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-[40px] pl-10 pr-4 bg-surface rounded-DEFAULT border border-outline-variant focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none font-body-md text-body-md text-on-surface transition-all" id="email" name="email" placeholder="manager@luxestay.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-[40px] pl-10 pr-10 bg-surface rounded-DEFAULT border border-outline-variant focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none font-body-md text-body-md text-on-surface transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg h-12 rounded-DEFAULT hover:-translate-y-0.5 hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Need technical support? <a class="text-primary font-medium hover:underline" href="#">Contact IT</a>
</p>
</div>
</div>
<!-- Footer Info -->
<div class="text-center mt-8 font-label-md text-label-md text-surface-container-high/70">
<p>© 2024 Luxe Stay Property Management System. All rights reserved.</p>
</div>
</div>
</body></html>
